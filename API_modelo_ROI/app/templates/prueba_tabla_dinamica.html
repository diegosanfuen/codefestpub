<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Dinámica</title>
</head>
<body>
    <h1>Tabla Dinámica</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody>
            {% for dato in datos_tabla %}
            <tr>
                <td>{{ dato.nombre }}</td>
                <td>{{ dato.edad }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
